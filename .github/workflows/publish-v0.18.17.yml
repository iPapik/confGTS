name: Publish ConfGTS 0.18.17 tested installers

on:
  push:
    branches: ['0.18.17']
    paths:
      - '.github/workflows/publish-v0.18.17.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-tested-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '38231691328'
      TESTED_SHA: 'aefb387aeceee5e474e4e6077f5c60c78c77d142'
    steps:
      - name: Verify Windows build passed at the tagged commit
        shell: bash
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion')"
          commit="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha')"
          test "$status" = success
          test "$commit" = "$TESTED_SHA"
      - name: Download exactly the successfully tested installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name ConfGTS-0.18.17-tested --dir artifacts
      - name: Verify all six files and checksums
        shell: bash
        run: |
          set -euo pipefail
          # upload-artifact preserves relative paths (msi/, setup/, server-msi/, etc).
          # Flatten into artifacts/ so the release and SHA256 validation use one directory.
          for name in \
            ConfGTS-0.18.17-x64.msi \
            ConfGTS-Setup-0.18.17-x64.exe \
            ConfGTS-Server-0.18.17-x64.msi \
            ConfGTS-Server-Setup-0.18.17-x64.exe \
            ConfGTS-Server-0.18.17-Source.zip \
            SHA256SUMS.txt; do
            source="$(find artifacts -type f -name "$name" -print -quit)"
            test -n "$source" || { echo "Missing $name in the downloaded artifact"; find artifacts -type f; exit 1; }
            if [ "$source" != "artifacts/$name" ]; then mv "$source" "artifacts/$name"; fi
          done
          for name in \
            ConfGTS-0.18.17-x64.msi \
            ConfGTS-Setup-0.18.17-x64.exe \
            ConfGTS-Server-0.18.17-x64.msi \
            ConfGTS-Server-Setup-0.18.17-x64.exe \
            ConfGTS-Server-0.18.17-Source.zip \
            SHA256SUMS.txt; do
            test -s "artifacts/$name" || { echo "Missing $name"; exit 1; }
          done
          (cd artifacts && sha256sum -c SHA256SUMS.txt)
      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE-NOTES.md <<'EOF'
          ## ConfGTS 0.18.17

          ### Исправление вылета настроек
          - Устранён аварийный выход клиента при открытии страницы настроек в основном окне и во время конференции.
          - Вместо стандартного WinUI ProgressBar микрофона используется безопасный визуальный индикатор входного уровня.
          - Поиск аудио- и видеоустройств теперь выполняется по кнопке «Обновить устройства», без автоматического опроса драйверов при открытии страницы.
          - Тесты на Windows подтвердили, что полная страница настроек остаётся открытой без аварийного завершения.

          ### Пошаговые EXE-установщики
          - Приветствие → папка установки → параметры автозапуска и ярлыков → подтверждение установки.
          - Для серверной части добавлен отдельный шаг выбора каталога записи конференций.
          - При смене каталога существующие записи переносятся с сохранением исходных файлов.
          - MSI оставлены для корпоративного развёртывания, GPO и штатного обновления Windows Installer.

          ### Файлы
          - `ConfGTS-Setup-0.18.17-x64.exe` — интерактивный установщик клиента.
          - `ConfGTS-0.18.17-x64.msi` — MSI клиента.
          - `ConfGTS-Server-Setup-0.18.17-x64.exe` — интерактивный установщик сервера.
          - `ConfGTS-Server-0.18.17-x64.msi` — MSI сервера.
          - `ConfGTS-Server-0.18.17-Source.zip` — исходники серверной части.
          - `SHA256SUMS.txt` — контрольные суммы.

          Проверено в GitHub Actions: https://github.com/iPapik/confGTS/actions/runs/38231691328
          EOF
      - name: Publish GitHub release and the four installers
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.18.17 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'Release already exists; synchronize its files.'
            gh release upload v0.18.17 artifacts/*.msi artifacts/*.exe \
              artifacts/ConfGTS-Server-0.18.17-Source.zip artifacts/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v0.18.17 --repo "$GITHUB_REPOSITORY" --notes-file RELEASE-NOTES.md
          else
            gh release create v0.18.17 \
              artifacts/ConfGTS-0.18.17-x64.msi \
              artifacts/ConfGTS-Setup-0.18.17-x64.exe \
              artifacts/ConfGTS-Server-0.18.17-x64.msi \
              artifacts/ConfGTS-Server-Setup-0.18.17-x64.exe \
              artifacts/ConfGTS-Server-0.18.17-Source.zip \
              artifacts/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TESTED_SHA" \
              --title 'ConfGTS 0.18.17' \
              --notes-file RELEASE-NOTES.md
          fi
      - name: Check public release asset listing
        shell: bash
        run: |
          gh release view v0.18.17 --repo "$GITHUB_REPOSITORY" \
            --json url,assets --jq '{url:.url,assets:[.assets[].name]}'
