name: Build ConfGTS Client 0.18.10

on:
  push:
    branches: [ main, 'beta-*', 'fix/*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: confgts-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build client MSI and EXE
        shell: pwsh
        run: .\build-installers.ps1

      - name: Verify client artifacts
        shell: pwsh
        run: |
          $required = @(
            'artifacts\publish\ConfGTS.Client.exe',
            'artifacts\msi\ConfGTS-0.18.10-x64.msi',
            'artifacts\setup\ConfGTS-Setup-0.18.10-x64.exe'
          )
          foreach ($file in $required) { if (!(Test-Path $file)) { throw "Missing artifact: $file" } }
          foreach ($dll in @('vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll')) {
            if (!(Test-Path (Join-Path 'artifacts\publish' $dll))) { throw "Client app-local runtime missing: $dll" }
          }
          if (Test-Path 'artifacts\publish\NAudio.dll') { throw 'NAudio.dll must not be present in the client build.' }
          $main = Get-Content '.\src\ConfGTS.Client\MainWindow.xaml.cs' -Raw -Encoding UTF8
          $settings = Get-Content '.\src\ConfGTS.Client\MediaSettingsWindow.cs' -Raw -Encoding UTF8
          if ($main -match 'Тип учетной записи' -or $main -match '_authModeBox') { throw 'Authentication type selector is still present.' }
          if ($main -match 'Идентификатор:' -or $main -match 'Text = "Постоянная конференция",') { throw 'Conference metadata is still present in the client card.' }
          if ($settings -match 'ms-settings:') { throw 'Device settings still open Windows Settings.' }
          if ($settings -notmatch 'DeviceInformation.FindAllAsync') { throw 'In-app device enumeration is missing.' }
          if ($settings -notmatch 'devices\.Select\(d => d\.Name\)\.ToList\(\)') { throw 'Closed ComboBox device-name rendering fix is missing.' }
          if ($settings -notmatch 'Камера не найдена' -or $settings -notmatch 'EnsureEmptyPlaceholder') { throw 'Camera selector empty-state field is missing.' }
          if ($main -notmatch 'const waitForRoom = async \(\) =>' -or $main -notmatch 'rooms\.some\(r => r && r\.id === roomId\)') { throw 'Conference room startup-race guard is missing.' }
          if ($main -notmatch '_conferenceHost is not null' -or $main -notmatch 'StopDashboardTimer\(\);') { throw 'Conference dashboard polling guard is missing.' }
          if ($main -notmatch 'unsafely-treat-insecure-origin-as-secure') { throw 'HTTP media secure-origin compatibility flag is missing.' }
          if ($main -notmatch 'native-hangup' -or $main -notmatch 'native-participants') { throw 'Conference participant/hangup controls are missing.' }
          if ($main -notmatch "postMessage\('leave-conference'\)" -or $main -notmatch 'ConferenceWebMessageReceived') { throw 'Native hangup bridge is missing.' }
          if ($main -notmatch '#conference > \.toolbar \{ display:none' -or $main -notmatch 'overflow:hidden !important') { throw 'Responsive conference layout rules are missing.' }
          if ($main -notmatch "track\.enabled = !track\.enabled") { throw 'Native microphone/camera toggles are missing.' }
          if ($main -notmatch 'Запомнить меня' -or $main -notmatch 'RememberedCredentials\.Save') { throw 'Remember-me UI or persistence is missing.' }
          if ($main -notmatch 'SetConferenceLayout\(true\)' -or $main -notmatch '_dashboardSidebar\.Visibility') { throw 'Fullscreen conference sidebar-collapse logic is missing.' }
          if ($main -notmatch "hangupBtn\.textContent = '☎ Выйти'") { throw 'Rectangular conference exit control is missing.' }
          if ($main -notmatch 'SidebarButton\("\\uE72B", "Выйти"\)') { throw 'Updated sidebar logout icon is missing.' }
          if ($main -notmatch 'window\.__confgtsMediaReady' -or $main -notmatch 'native-pending') { throw 'Immediate conference media-control state is missing.' }
          if ($main -notmatch 'await _api\.LogoutAsync\(\)' -or $main -notmatch '_dashboardFailureCount >= 3') { throw 'Logout/session or connection-state stabilization is missing.' }
          if ($main -notmatch 'Text = "Запомнить меня"') { throw 'Visible remember-me label is missing.' }
          if ($main -notmatch '_rememberMeBox\.MinWidth = 0' -or $main -notmatch 'ColumnSpacing = 7') { throw 'Compact remember-me alignment fix is missing.' }
          if ($main -notmatch "postMessage\('toggle-sidebar'\)" -or $main -notmatch 'SetConferenceSidebarVisible' -or $main -notmatch 'native-sidebar') { throw 'Conference sidebar toggle bridge is missing.' }
          if ($main -notmatch '_settingsOpenedFromConference' -or $main -notmatch 'Returned from device settings to active conference' -or $main -notmatch '_conferenceHost\.Visibility = Visibility\.Collapsed') { throw 'Settings do not preserve the active conference.' }
          if ($settings -match 'Камера, микрофон и звук настраиваются внутри ConfGTS' -or $settings -match 'Устройства обновлены\. Выбранные устройства') { throw 'Removed device-settings text is still present.' }
          Get-Item $required | Select-Object Name,Length | Format-Table -AutoSize

      - name: Settings navigation smoke test
        shell: pwsh
        run: |
          $startupLog = "$env:LOCALAPPDATA\ConfGTS\logs\startup.log"
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'artifacts\publish\ConfGTS.Client.exe').Path
          $p = Start-Process $exe -ArgumentList '--self-test-settings' -PassThru
          Start-Sleep -Seconds 10
          $log = if (Test-Path $startupLog) { Get-Content $startupLog -Raw } else { '' }
          if ($p.HasExited -or $log -notmatch 'Settings smoke test completed\.' -or $log -notmatch 'MediaSettingsPanel 0.18.10 constructor completed\.' -or $log -notmatch 'In-app media settings initialized\.' -or $log -match 'Fatal error|Settings smoke test failed|XAML parsing failed') {
            if (Test-Path $startupLog) { Get-Content $startupLog -Tail 160 }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Published client failed the settings navigation smoke test.'
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Test client MSI installation and settings
        shell: pwsh
        run: |
          $msi = (Resolve-Path 'artifacts\msi\ConfGTS-0.18.10-x64.msi').Path
          $installedExe = Join-Path $env:ProgramFiles 'ГТС\ConfGTS\ConfGTS.Client.exe'
          $startMenu = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\ConfGTS\ConfGTS.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'ConfGTS.lnk'
          $startupLog = "$env:LOCALAPPDATA\ConfGTS\logs\startup.log"
          $install = Start-Process msiexec.exe -ArgumentList @('/i', ('"' + $msi + '"'), '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Client MSI install failed: $($install.ExitCode)" }
          foreach ($path in @($installedExe,$startMenu,$desktop)) { if (!(Test-Path $path)) { throw "Missing installed path: $path" } }
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          $app = Start-Process $installedExe -ArgumentList '--self-test-settings' -PassThru
          Start-Sleep -Seconds 10
          $log = if (Test-Path $startupLog) { Get-Content $startupLog -Raw } else { '' }
          if ($app.HasExited -or $log -notmatch 'Settings smoke test completed\.') {
            if (Test-Path $startupLog) { Get-Content $startupLog -Tail 160 }
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            throw 'MSI-installed client failed the settings smoke test.'
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $remove = Start-Process msiexec.exe -ArgumentList @('/x', ('"' + $msi + '"'), '/qn', '/norestart') -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Client MSI uninstall failed: $($remove.ExitCode)" }

      - name: Test client EXE installation and settings
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'artifacts\setup\ConfGTS-Setup-0.18.10-x64.exe').Path
          $installedExe = Join-Path $env:ProgramFiles 'ГТС\ConfGTS\ConfGTS.Client.exe'
          $startupLog = "$env:LOCALAPPDATA\ConfGTS\logs\startup.log"
          $p = Start-Process $setup -ArgumentList @('/quiet','/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Client EXE install failed: $($p.ExitCode)" }
          if (!(Test-Path $installedExe)) { throw "Client EXE missing after install: $installedExe" }
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          $app = Start-Process $installedExe -ArgumentList '--self-test-settings' -PassThru
          Start-Sleep -Seconds 10
          $log = if (Test-Path $startupLog) { Get-Content $startupLog -Raw } else { '' }
          if ($app.HasExited -or $log -notmatch 'Settings smoke test completed\.') {
            if (Test-Path $startupLog) { Get-Content $startupLog -Tail 160 }
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            throw 'EXE-installed client failed the settings smoke test.'
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $p = Start-Process $setup -ArgumentList @('/uninstall','/quiet','/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Client EXE uninstall failed: $($p.ExitCode)" }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $files = @('artifacts\msi\ConfGTS-0.18.10-x64.msi','artifacts\setup\ConfGTS-Setup-0.18.10-x64.exe')
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash $file -Algorithm SHA256
            "$($hash.Hash.ToLower())  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content 'artifacts\SHA256SUMS-client.txt' -Encoding ascii
          Get-Content 'artifacts\SHA256SUMS-client.txt'

      - name: Upload tested client packages
        uses: actions/upload-artifact@v4
        with:
          name: ConfGTS-Client-0.18.10-tested
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            artifacts/msi/ConfGTS-0.18.10-x64.msi
            artifacts/setup/ConfGTS-Setup-0.18.10-x64.exe
            artifacts/SHA256SUMS-client.txt

      - name: Publish client GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.18.10 --cleanup-tag --yes 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host 'No previous v0.18.10 release to delete.' }
          @'
          Клиентская сборка 0.18.10.

          - «Настройки устройств», открытые из боковой панели конференции, больше не завершают активную конференцию.
          - После закрытия настроек пользователь возвращается в ту же конференцию; WebView2/WebRTC-сессия и запись не пересоздаются.
          - Восстанавливается состояние боковой панели конференции.
          - Сохранены исправления «Запомнить меня», управления устройствами, панели конференции и стабильности входа.
          '@ | Set-Content 'artifacts\RELEASE-NOTES-client.md' -Encoding utf8
          gh release create v0.18.10 'artifacts\msi\ConfGTS-0.18.10-x64.msi' 'artifacts\setup\ConfGTS-Setup-0.18.10-x64.exe' 'artifacts\SHA256SUMS-client.txt' --target '${{ github.sha }}' --title 'ConfGTS Client 0.18.10' --notes-file 'artifacts\RELEASE-NOTES-client.md'