name: Build ConfGTS Windows installers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show SDK
        shell: pwsh
        run: dotnet --info

      - name: Build MSI and EXE
        shell: pwsh
        run: .\build-installers.ps1

      - name: Verify artifacts
        shell: pwsh
        run: |
          $msi = 'artifacts\msi\ConfGTS-0.15.0-x64.msi'
          $exe = 'artifacts\setup\ConfGTS-Setup-0.15.0-x64.exe'
          if (!(Test-Path $msi)) { throw "MSI not found" }
          if (!(Test-Path $exe)) { throw "EXE not found" }
          Get-Item $msi, $exe | Format-Table Name, Length

      - name: Test MSI installation
        shell: pwsh
        run: |
          $msi = (Resolve-Path 'artifacts\msi\ConfGTS-0.15.0-x64.msi').Path
          $installedExe = Join-Path $env:ProgramFiles 'ГТС\ConfGTS\ConfGTS.Client.exe'

          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI install failed with exit code $($p.ExitCode)" }
          if (!(Test-Path $installedExe)) { throw "MSI completed but ConfGTS.Client.exe was not installed" }

          $p = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI uninstall failed with exit code $($p.ExitCode)" }
          if (Test-Path $installedExe) { throw "MSI uninstall left ConfGTS.Client.exe behind" }

      - name: Test EXE installation
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'artifacts\setup\ConfGTS-Setup-0.15.0-x64.exe').Path
          $installedExe = Join-Path $env:ProgramFiles 'ГТС\ConfGTS\ConfGTS.Client.exe'

          $p = Start-Process $setup -ArgumentList @('/quiet', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE install failed with exit code $($p.ExitCode)" }
          if (!(Test-Path $installedExe)) { throw "EXE completed but ConfGTS.Client.exe was not installed" }

          $p = Start-Process $setup -ArgumentList @('/uninstall', '/quiet', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE uninstall failed with exit code $($p.ExitCode)" }
          if (Test-Path $installedExe) { throw "EXE uninstall left ConfGTS.Client.exe behind" }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $files = @('artifacts\msi\ConfGTS-0.15.0-x64.msi','artifacts\setup\ConfGTS-Setup-0.15.0-x64.exe')
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash $file -Algorithm SHA256
            "$($hash.Hash.ToLower())  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content 'artifacts\SHA256SUMS.txt' -Encoding ascii
          Get-Content 'artifacts\SHA256SUMS.txt'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ConfGTS-0.15.0-installers
          path: |
            artifacts/msi/ConfGTS-0.15.0-x64.msi
            artifacts/setup/ConfGTS-Setup-0.15.0-x64.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish public GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.15.0 --cleanup-tag --yes 2>$null
          $msi = 'artifacts\msi\ConfGTS-0.15.0-x64.msi'
          $exe = 'artifacts\setup\ConfGTS-Setup-0.15.0-x64.exe'
          $sums = 'artifacts\SHA256SUMS.txt'
          gh release create v0.15.0 $msi $exe $sums --target "${{ github.sha }}" --title 'ConfGTS 0.15.0' --notes 'Проверенные Windows x64 установщики. Перед публикацией GitHub Actions автоматически устанавливает и удаляет оба пакета.'
