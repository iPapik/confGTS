name: Build ConfGTS Windows installers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show SDK
        shell: pwsh
        run: dotnet --info

      - name: Build MSI and EXE
        shell: pwsh
        run: .\build-installers.ps1

      - name: Verify artifacts and app-local runtime
        shell: pwsh
        run: |
          $msi = 'artifacts\msi\ConfGTS-0.15.2-x64.msi'
          $setup = 'artifacts\setup\ConfGTS-Setup-0.15.2-x64.exe'
          $client = 'artifacts\publish\ConfGTS.Client.exe'
          foreach ($file in @($msi,$setup,$client)) {
            if (!(Test-Path $file)) { throw "Missing build artifact: $file" }
          }
          foreach ($dll in @('vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll')) {
            $path = Join-Path 'artifacts\publish' $dll
            if (!(Test-Path $path)) { throw "Missing app-local VC++ runtime: $dll" }
          }

      - name: Launch-test published WinUI client
        shell: pwsh
        run: |
          $log = "$env:LOCALAPPDATA\ConfGTS\logs\startup.log"
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $p = Start-Process (Resolve-Path 'artifacts\publish\ConfGTS.Client.exe').Path -PassThru
          Start-Sleep -Seconds 7
          $content = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
          if ($p.HasExited -or $content -notmatch 'Main window activated\.' -or $content -match 'Fatal error|Unhandled WinUI exception') {
            if (Test-Path $log) { Get-Content $log -Tail 120 }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "Published ConfGTS did not reach a successful main-window activation."
          }
          Write-Host "Published client activated the main window successfully."
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: Test MSI install, shortcuts and launch
        shell: pwsh
        run: |
          $msi = (Resolve-Path 'artifacts\msi\ConfGTS-0.15.2-x64.msi').Path
          $installedExe = Join-Path $env:ProgramFiles 'ГТС\ConfGTS\ConfGTS.Client.exe'
          $startMenu = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\ConfGTS\ConfGTS.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'ConfGTS.lnk'
          $log = "$env:LOCALAPPDATA\ConfGTS\logs\startup.log"

          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI install failed with exit code $($p.ExitCode)" }
          if (!(Test-Path $installedExe)) { throw "MSI completed but ConfGTS.Client.exe was not installed" }
          if (!(Test-Path $startMenu)) { throw "Start menu shortcut was not created: $startMenu" }
          if (!(Test-Path $desktop)) { throw "Desktop shortcut was not created: $desktop" }

          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $app = Start-Process $installedExe -PassThru
          Start-Sleep -Seconds 7
          $content = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
          if ($app.HasExited -or $content -notmatch 'Main window activated\.' -or $content -match 'Fatal error|Unhandled WinUI exception') {
            if (Test-Path $log) { Get-Content $log -Tail 120 }
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            throw "MSI-installed ConfGTS did not activate its main window."
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          $p = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI uninstall failed with exit code $($p.ExitCode)" }

      - name: Test EXE install, shortcuts and launch
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'artifacts\setup\ConfGTS-Setup-0.15.2-x64.exe').Path
          $installedExe = Join-Path $env:ProgramFiles 'ГТС\ConfGTS\ConfGTS.Client.exe'
          $startMenu = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\ConfGTS\ConfGTS.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'ConfGTS.lnk'
          $log = "$env:LOCALAPPDATA\ConfGTS\logs\startup.log"

          $p = Start-Process $setup -ArgumentList @('/quiet', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE install failed with exit code $($p.ExitCode)" }
          if (!(Test-Path $installedExe)) { throw "EXE completed but ConfGTS.Client.exe was not installed" }
          if (!(Test-Path $startMenu)) { throw "EXE did not create Start menu shortcut" }
          if (!(Test-Path $desktop)) { throw "EXE did not create Desktop shortcut" }

          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $app = Start-Process $installedExe -PassThru
          Start-Sleep -Seconds 7
          $content = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
          if ($app.HasExited -or $content -notmatch 'Main window activated\.' -or $content -match 'Fatal error|Unhandled WinUI exception') {
            if (Test-Path $log) { Get-Content $log -Tail 120 }
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            throw "EXE-installed ConfGTS did not activate its main window."
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          $p = Start-Process $setup -ArgumentList @('/uninstall', '/quiet', '/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE uninstall failed with exit code $($p.ExitCode)" }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $files = @('artifacts\msi\ConfGTS-0.15.2-x64.msi','artifacts\setup\ConfGTS-Setup-0.15.2-x64.exe')
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash $file -Algorithm SHA256
            "$($hash.Hash.ToLower())  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content 'artifacts\SHA256SUMS.txt' -Encoding ascii
          Get-Content 'artifacts\SHA256SUMS.txt'

      - name: Upload tested installers
        uses: actions/upload-artifact@v4
        with:
          name: ConfGTS-0.15.2-tested-installers
          path: |
            artifacts/msi/ConfGTS-0.15.2-x64.msi
            artifacts/setup/ConfGTS-Setup-0.15.2-x64.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish public GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.15.2 --cleanup-tag --yes 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host 'No previous v0.15.2 release to delete.' }
          $msi = 'artifacts\msi\ConfGTS-0.15.2-x64.msi'
          $exe = 'artifacts\setup\ConfGTS-Setup-0.15.2-x64.exe'
          $sums = 'artifacts\SHA256SUMS.txt'
          gh release create v0.15.2 $msi $exe $sums --target "${{ github.sha }}" --title 'ConfGTS 0.15.2' --notes 'Исправлен запуск WinUI 3: добавлены обязательные XamlControlsResources. CI теперь проверяет строку Main window activated в startup.log и отклоняет сборку при XAML parsing failed.'
