name: Build full ConfGTS client and server (manual)

on:
  push:
    branches: [ main, 'beta-full-*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: confgts-windows-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Reconstruct base server source
        shell: pwsh
        run: |
          $parts = Get-ChildItem '.\server-source\parts\part*.b64' | Sort-Object Name
          if ($parts.Count -ne 11) { throw "Expected 11 server source parts, found $($parts.Count)." }
          $builder = [System.Text.StringBuilder]::new()
          foreach ($part in $parts) {
            [void]$builder.Append((Get-Content $part.FullName -Raw).Trim())
          }
          $zip = Join-Path $env:RUNNER_TEMP 'ConfGTS-Server-0.16.0-Base.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($builder.ToString()))
          Expand-Archive $zip -DestinationPath '.' -Force

      - name: Apply ConfGTS Server 0.18.14 overlays
        shell: pwsh
        run: .\server-overrides\apply.ps1

      - name: Validate 0.18.14 server UI changes
        shell: pwsh
        run: |
          $admin = Get-Content '.\server\admin.go' -Raw -Encoding UTF8
          if ($admin.Contains('<div class=field><label>E-mail</label><input name=email type=email></div>')) {
            throw "Local-user E-mail field is still present in server admin UI."
          }
          if ($admin.Contains('CreateLocalUser(r.FormValue("username"), r.FormValue("display_name"), r.FormValue("email")')) {
            throw "Local-user creation still requires an E-mail form value."
          }
          Write-Host 'Local-user creation no longer requires E-mail.' -ForegroundColor Green
          $ui = Get-Content '.\server\ui.go' -Raw -Encoding UTF8
          if ($ui -notmatch 'MediaRecorder' -or $ui -notmatch 'captureStream\(15\)') {
            throw "Automatic composite conference recording is missing."
          }
          if ($ui -notmatch 'stopLoops\(false\);await stopRecording\(\);try\{await api') {
            throw "Recording is not finalized before recorder leaves."
          }
          if ($ui -notmatch 'recorder\.start\(2000\)') {
            throw "Recording chunk interval is not 2 seconds."
          }

          if ($ui -notmatch 'recorder\.start\(2000\);drawRecording\(\)') {
            throw 'Recorder canvas draw loop is not started after MediaRecorder.'
          }
          if ($ui -notmatch 'setTimeout\(drawRecording,67\)' -or $ui -match 'requestAnimationFrame\(drawRecording\)') {
            throw 'Recording compositor is still tied to requestAnimationFrame background throttling.'
          }
          if ($ui -notmatch 'norm\(roomState\.recorder\)===norm\(ME\.username\)') {
            throw "Domain username normalization for recorder election is missing."
          }
          if ($ui -notmatch 'handleConferenceStopped' -or $ui -notmatch "postMessage\('leave-conference'\)") {
            throw "Server-side conference stop is not propagated to clients."
          }
          if ($ui -notmatch 'ConfGTS recording audio mix unavailable') {
            throw "No-microphone recording fallback is missing."
          }
          if ($ui -notmatch 'pc\.__confgtsVideoSender' -or $ui -notmatch 'pc\.addTransceiver' -or $ui -notmatch 'direction:\x27sendrecv\x27') {
            throw "Permanent audio/video peer transceivers are missing."
          }
          if ($ui -notmatch 'pc\.__confgtsPendingIce' -or $ui -notmatch 'flushPeerIce' -or $ui -notmatch 'else pc\.__confgtsPendingIce\.push') {
            throw "ICE candidates are not queued before remote descriptions."
          }
          if ($ui -notmatch 'window\.__confgtsScreenTrack=nt' -or $ui -notmatch 'Камера выключена') {
            throw "No-camera screen sharing or participant placeholder support is missing."
          }
          if ($ui -notmatch "ctx\.fillText\('Без видео'" -or $ui -notmatch "document\.querySelectorAll\('\.video-tile'\)") {
            throw "Full-conference recording compositor is missing."
          }
          if ($ui -notmatch 'recordingContext=ctx' -or $ui -notmatch 'recording context missing' -or $ui -notmatch 'attempt<4') {
            throw "Stable recording context or retry upload hardening is missing."
          }
          if ($ui -notmatch 'video/mp4' -or $ui -notmatch 'video/webm' -or $ui -notmatch 'ctx\.bytes\+=chunk\.size') {
            throw "MP4-first recording with MKV fallback or real-chunk tracking is missing."
          }
          if ($ui -match 'new Blob\(\[\]') {
            throw "Zero-byte recording handshake must not create empty archive entries."
          }
          $store = Get-Content '.\server\store.go' -Raw -Encoding UTF8
          if ($store -notmatch 'ext := "\.mkv"' -or $store -notmatch 'ext = "\.mp4"') {
            throw "Server MP4/MKV filename selection is missing."
          }
          $web = Get-Content '.\server\web.go' -Raw -Encoding UTF8
          if ($web -notmatch 'zero-byte recording upload ignored' -or $web -notmatch 'if len\(data\) == 0') {
            throw "Server still allows empty recording uploads to create archive entries."
          }
          $remux = Get-Content '.\server\recording_finalize.go' -Raw -Encoding UTF8
          if ($web -notmatch 'go a\.store\.OptimizeRecording\(in\.CaptureID\)' -or $web -notmatch 'OptimizeRecordingByID\(rec\.ID\)') {
            throw "Recording finalize/download endpoints are not wired to seekable remux."
          }
          if ($remux -notmatch 'func \(s \*Store\) OptimizeRecording' -or $remux -notmatch '\+faststart' -or $remux -notmatch '\.seekable' -or $remux -notmatch 'exec\.Command\(ffmpeg') {
            throw "MP4/MKV ffmpeg remux implementation is missing."
          }
          $buildServer = Get-Content '.\build-server.ps1' -Raw -Encoding UTF8
          if ($buildServer -notmatch 'ConfGTS bundled ffmpeg' -or $buildServer -notmatch 'ffmpegTarget') {
            throw "Server build does not bundle ffmpeg.exe."
          }
          $admin = Get-Content '.\server\admin.go' -Raw -Encoding UTF8
          if ($admin -notmatch 'confgts-live-participants' -or $admin -notmatch 'setInterval\(refreshParticipants,1500\)') {
            throw "Live conference participant refresh is missing from server admin UI."
          }
          if ($store -notmatch 'Finalize unfinished recordings for the stopped session' -or $store -notmatch 'Finalize unfinished recordings when the room becomes empty') {
            throw "Server recording finalization guards are missing."
          }
          $web = Get-Content '.\server\web.go' -Raw -Encoding UTF8
          if ($web -notmatch 'time\.Since\(\*existing\.FinishedAt\) <= 30\*time\.Second') {
            throw "Final recording-chunk grace period after admin stop is missing."
          }
          if ($web -notmatch 'CanUploadEndedSessionRecording' -or $store -notmatch 'func \(s \*Store\) CanUploadEndedSessionRecording') {
            throw "Immediate-admin-stop final-chunk authorization is missing."
          }
          Write-Host 'Automatic recording lifecycle is present.' -ForegroundColor Green

      - name: Format and test server source
        shell: pwsh
        run: |
          Get-ChildItem '.\server' -Filter *.go -File | ForEach-Object { gofmt -w $_.FullName }
          go test ./server
          if ($LASTEXITCODE -ne 0) { throw "Go server tests failed." }

      - name: Package server source
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'ConfGTS-Server-0.18.14-Source'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item '.\go.mod' $stage -Force
          Copy-Item '.\server' (Join-Path $stage 'server') -Recurse -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'src') | Out-Null
          Copy-Item '.\src\ConfGTS.Server.Settings' (Join-Path $stage 'src\ConfGTS.Server.Settings') -Recurse -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'Installer') | Out-Null
          Copy-Item '.\Installer\Server' (Join-Path $stage 'Installer\Server') -Recurse -Force
          Copy-Item '.\build-server.ps1' $stage -Force
          New-Item -ItemType Directory -Force -Path '.\artifacts' | Out-Null
          Compress-Archive -Path "$stage\*" -DestinationPath '.\artifacts\ConfGTS-Server-0.18.14-Source.zip' -Force

      - name: Validate tray, auto-login and compact sidebar changes
        shell: pwsh
        run: |
          $client = (Get-Content '.\src\ConfGTS.Client\MainWindow.xaml.cs' -Raw -Encoding UTF8) + [Environment]::NewLine +
                    (Get-Content '.\src\ConfGTS.Client\App.xaml.cs' -Raw -Encoding UTF8)
          $project = Get-Content '.\src\ConfGTS.Client\ConfGTS.Client.csproj' -Raw -Encoding UTF8
          if ($client -notmatch 'ShellNotifyIcon' -or $client -notmatch 'SetWindowSubclass') {
            throw 'Native Win32 tray support is missing from the client.'
          }
          foreach ($token in @(
            'AppWindow_Closing',
            'HideMainWindow',
            'ShowApplicationSettingsAsync',
            'RememberedCredentials.Clear',
            'PerformLoginAsync\(autoLogin: true\)',
            'SidebarIconButton',
            'new GridLength\(270\)'
          )) {
            if ($client -notmatch $token) { throw "Missing client feature marker: $token" }
          }
          Write-Host 'Tray, remembered auto-login and compact sidebar markers are present.' -ForegroundColor Green

      - name: Validate custom install folders and recording storage settings
        shell: pwsh
        run: |
          $clientPackage = Get-Content '.\Installer\Package.wxs' -Raw -Encoding UTF8
          $clientBundle = Get-Content '.\Installer\Bootstrapper\Bundle.wxs' -Raw -Encoding UTF8
          $serverSettings = Get-Content '.\server-overrides\src\ConfGTS.Server.Settings\SettingsWindow.cs' -Raw -Encoding UTF8
          $serverConfig = Get-Content '.\server-overrides\src\ConfGTS.Server.Settings\ConfigManager.cs' -Raw -Encoding UTF8
          $overlay = Get-Content '.\server-overrides\apply.ps1' -Raw -Encoding UTF8
          if ($clientPackage -notmatch 'WixUI_InstallDir' -or $clientPackage -notmatch 'InstallDirectory="INSTALLFOLDER"') {
            throw 'Client MSI install-directory UI is missing.'
          }
          if ($clientBundle -notmatch 'Variable Name="InstallFolder"' -or $clientBundle -notmatch 'SuppressOptionsUI="no"' -or $clientBundle -notmatch 'MsiProperty Name="INSTALLFOLDER"') {
            throw 'Client EXE install-directory options are missing.'
          }
          if ($serverSettings -notmatch 'Хранение записей' -or $serverSettings -notmatch 'PickRecordingsFolderAsync') {
            throw 'Server recording directory UI is missing.'
          }
          if ($serverConfig -notmatch 'ApplyRecordingDirectoryAsync' -or $serverConfig -notmatch 'mklink /J' -or $serverConfig -notmatch 'recordings_path') {
            throw 'Server recording directory redirection is missing.'
          }
          if ($overlay -notmatch 'WixUI_InstallDir' -or $overlay -notmatch 'Variable Name="InstallFolder"' -or $overlay -notmatch 'SuppressOptionsUI="no"') {
            throw 'Server installer custom-directory overlay is missing.'
          }
          Write-Host 'Custom install paths and recording storage settings are present.' -ForegroundColor Green

      - name: Build client MSI and EXE
        shell: pwsh
        run: .\build-installers.ps1

      - name: Build server MSI and EXE
        shell: pwsh
        run: .\build-server.ps1

      - name: Verify build artifacts
        shell: pwsh
        run: |
          $required = @(
            'artifacts\publish\ConfGTS.Client.exe',
            'artifacts\msi\ConfGTS-0.18.14-x64.msi',
            'artifacts\setup\ConfGTS-Setup-0.18.14-x64.exe',
            'artifacts\server-publish\ConfGTSServer.exe',
            'artifacts\server-publish\ConfGTS.Server.Settings.exe',
            'artifacts\server-publish\ffmpeg.exe',
            'artifacts\server-msi\ConfGTS-Server-0.18.14-x64.msi',
            'artifacts\server-setup\ConfGTS-Server-Setup-0.18.14-x64.exe',
            'artifacts\ConfGTS-Server-0.18.14-Source.zip'
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing artifact: $file" }
          }
          foreach ($dll in @('vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll')) {
            if (!(Test-Path (Join-Path 'artifacts\publish' $dll))) { throw "Client app-local runtime missing: $dll" }
            if (!(Test-Path (Join-Path 'artifacts\server-publish' $dll))) { throw "Server settings app-local runtime missing: $dll" }
          }
          $ffmpeg = (Resolve-Path 'artifacts\server-publish\ffmpeg.exe').Path
          if ((Get-Item $ffmpeg).Length -lt 1MB) { throw "Bundled ffmpeg.exe is unexpectedly small." }
          $ffmpegCheck = Start-Process -FilePath $ffmpeg -ArgumentList '-version' -Wait -PassThru -NoNewWindow
          if ($ffmpegCheck.ExitCode -ne 0) { throw "Bundled ffmpeg.exe failed startup with exit code $($ffmpegCheck.ExitCode)." }
          Get-Item $required | Select-Object Name,Length | Format-Table -AutoSize

      - name: Launch-test published client
        shell: pwsh
        run: |
          $startupLog = "$env:LOCALAPPDATA\ConfGTS\logs\startup.log"
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          $p = Start-Process (Resolve-Path 'artifacts\publish\ConfGTS.Client.exe').Path -PassThru
          Start-Sleep -Seconds 8
          $log = if (Test-Path $startupLog) { Get-Content $startupLog -Raw } else { '' }
          if ($p.HasExited -or $log -notmatch 'Main window activated\.' -or $log -notmatch 'System tray icon initialized\.' -or $log -match 'Fatal error|Unhandled WinUI exception|XAML parsing failed') {
            if (Test-Path $startupLog) { Get-Content $startupLog -Tail 120 }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "Published ConfGTS client failed the real startup test."
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Test client MSI installation, shortcuts and startup
        shell: pwsh
        run: |
          $msi = (Resolve-Path 'artifacts\msi\ConfGTS-0.18.14-x64.msi').Path
          $customClientDir = Join-Path $env:ProgramFiles 'ConfGTS-CI-Custom'
          $installedExe = Join-Path $customClientDir 'ConfGTS.Client.exe'
          $startMenu = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\ConfGTS\ConfGTS.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'ConfGTS.lnk'
          $startupLog = "$env:LOCALAPPDATA\ConfGTS\logs\startup.log"

          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", "INSTALLFOLDER=`"$customClientDir`"", '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Client MSI install failed: $($install.ExitCode)" }
          foreach ($path in @($installedExe,$startMenu,$desktop)) {
            if (!(Test-Path $path)) { throw "Client MSI expected path missing: $path" }
          }

          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          $app = Start-Process $installedExe -PassThru
          Start-Sleep -Seconds 8
          $log = if (Test-Path $startupLog) { Get-Content $startupLog -Raw } else { '' }
          if ($app.HasExited -or $log -notmatch 'Main window activated\.' -or $log -notmatch 'System tray icon initialized\.' -or $log -match 'Fatal error|Unhandled WinUI exception|XAML parsing failed') {
            if (Test-Path $startupLog) { Get-Content $startupLog -Tail 120 }
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            throw "MSI-installed client failed startup."
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          $remove = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Client MSI uninstall failed: $($remove.ExitCode)" }

      - name: Test client EXE installation, shortcuts and startup
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'artifacts\setup\ConfGTS-Setup-0.18.14-x64.exe').Path
          $installedExe = Join-Path $env:ProgramFiles 'ГТС\ConfGTS\ConfGTS.Client.exe'
          $startMenu = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\ConfGTS\ConfGTS.lnk'
          $desktop = Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'ConfGTS.lnk'
          $startupLog = "$env:LOCALAPPDATA\ConfGTS\logs\startup.log"

          $p = Start-Process $setup -ArgumentList @('/quiet','/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Client EXE install failed: $($p.ExitCode)" }
          foreach ($path in @($installedExe,$startMenu,$desktop)) {
            if (!(Test-Path $path)) { throw "Client EXE expected path missing: $path" }
          }

          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          $app = Start-Process $installedExe -PassThru
          Start-Sleep -Seconds 8
          $log = if (Test-Path $startupLog) { Get-Content $startupLog -Raw } else { '' }
          if ($app.HasExited -or $log -notmatch 'Main window activated\.' -or $log -notmatch 'System tray icon initialized\.' -or $log -match 'Fatal error|Unhandled WinUI exception|XAML parsing failed') {
            if (Test-Path $startupLog) { Get-Content $startupLog -Tail 120 }
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            throw "EXE-installed client failed startup."
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          $p = Start-Process $setup -ArgumentList @('/uninstall','/quiet','/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Client EXE uninstall failed: $($p.ExitCode)" }

      - name: Test server MSI, service, name access, settings app and web interface
        shell: pwsh
        run: |
          function Wait-Server {
            param([string]$Uri)
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod -Uri $Uri -TimeoutSec 2
                if ($health.ok -eq $true) { return $health }
              } catch {}
              Start-Sleep -Seconds 1
            }
            throw "ConfGTS Server health endpoint did not become ready: $Uri"
          }

          $msi = (Resolve-Path 'artifacts\server-msi\ConfGTS-Server-0.18.14-x64.msi').Path
          $serverDir = Join-Path $env:ProgramFiles 'ConfGTS-Server-CI-Custom'
          $serverExe = Join-Path $serverDir 'ConfGTSServer.exe'
          $settingsExe = Join-Path $serverDir 'ConfGTS.Server.Settings.exe'
          $ffmpegExe = Join-Path $serverDir 'ffmpeg.exe'
          $desktop = Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'ConfGTS Server Settings.lnk'
          $menuDir = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\ConfGTS Server'
          $menuSettings = Join-Path $menuDir 'ConfGTS Server Settings.lnk'
          $menuWeb = Join-Path $menuDir 'ConfGTS Server Web.lnk'

          Remove-Item "$env:ProgramData\ConfGTS" -Recurse -Force -ErrorAction SilentlyContinue
          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", "INSTALLFOLDER=`"$serverDir`"", '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Server MSI install failed: $($install.ExitCode)" }

          foreach ($path in @($serverExe,$settingsExe,$ffmpegExe,$desktop,$menuSettings,$menuWeb)) {
            if (!(Test-Path $path)) { throw "Server MSI expected path missing: $path" }
          }

          $svc = Get-Service 'ConfGTSServer' -ErrorAction Stop
          if ($svc.Status -ne 'Running') { Start-Service 'ConfGTSServer' }

          $health = Wait-Server 'http://127.0.0.1:8090/health'
          if ($health.version -ne '0.18.14') { throw "Unexpected server version: $($health.version)" }

          $nameHealth = Wait-Server ("http://{0}:8090/health" -f $env:COMPUTERNAME)
          if ($nameHealth.ok -ne $true) { throw "Server is not reachable by Windows computer name." }

          $web = Invoke-WebRequest -Uri 'http://127.0.0.1:8090/server-login' -UseBasicParsing -TimeoutSec 5
          if ($web.StatusCode -ne 200 -or $web.Content -notmatch 'ConfGTS' -or $web.Content -notmatch '#0B2F5B') {
            throw "Server web interface/style test failed."
          }

          $udp = [System.Net.Sockets.UdpClient]::new()
          try {
            $udp.Client.ReceiveTimeout = 3000
            $bytes = [Text.Encoding]::UTF8.GetBytes('CONFGTS_DISCOVER_V1|confgts')
            [void]$udp.Send($bytes, $bytes.Length, '127.0.0.1', 8091)
            $remote = [System.Net.IPEndPoint]::new([System.Net.IPAddress]::Any, 0)
            $reply = $udp.Receive([ref]$remote)
            $json = [Text.Encoding]::UTF8.GetString($reply) | ConvertFrom-Json
            if ($json.protocol -ne 'CONFGTS_V1' -or $json.port -ne 8090) {
              throw "Unexpected ConfGTS discovery reply."
            }
          } finally {
            $udp.Dispose()
          }

          $configPath = "$env:ProgramData\ConfGTS\config.json"
          $cfg = Get-Content $configPath -Raw | ConvertFrom-Json
          $cfg.public_url = "https://$env:COMPUTERNAME`:8090"
          $cfg.https.enabled = $true
          $cfg.https.cert_file = ""
          $cfg.https.key_file = ""
          $cfg | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding utf8
          Restart-Service ConfGTSServer -Force

          $httpsReady = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $httpsHealth = Invoke-RestMethod -Uri "https://$env:COMPUTERNAME`:8090/health" -SkipCertificateCheck -TimeoutSec 2
              if ($httpsHealth.ok -eq $true) { $httpsReady = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (!$httpsReady) { throw "ConfGTS HTTPS health endpoint did not become ready." }
          $cfgAfter = Get-Content $configPath -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($cfgAfter.https.cert_file) -or !(Test-Path $cfgAfter.https.cert_file)) {
            throw "Automatic HTTPS certificate was not generated."
          }
          if ([string]::IsNullOrWhiteSpace($cfgAfter.https.key_file) -or !(Test-Path $cfgAfter.https.key_file)) {
            throw "Automatic HTTPS private key was not generated."
          }

          $settingsLog = "$env:LOCALAPPDATA\ConfGTS\server-settings.log"
          Remove-Item $settingsLog -Force -ErrorAction SilentlyContinue
          $settings = Start-Process $settingsExe -PassThru
          Start-Sleep -Seconds 5
          $settingsText = if (Test-Path $settingsLog) { Get-Content $settingsLog -Raw } else { '' }
          if ($settingsText -match 'Settings window startup failed|Unhandled WinUI exception') {
            if (Test-Path $settingsLog) { Get-Content $settingsLog -Tail 100 }
            throw "ConfGTS Server Settings reported a startup failure."
          }
          if (!$settings.HasExited) { Stop-Process -Id $settings.Id -Force -ErrorAction SilentlyContinue }

          $remove = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Server MSI uninstall failed: $($remove.ExitCode)" }

      - name: Test server EXE installer, service, name access and web interface
        shell: pwsh
        run: |
          function Wait-Server {
            param([string]$Uri)
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod -Uri $Uri -TimeoutSec 2
                if ($health.ok -eq $true) { return $health }
              } catch {}
              Start-Sleep -Seconds 1
            }
            throw "ConfGTS Server health endpoint did not become ready: $Uri"
          }

          $setup = (Resolve-Path 'artifacts\server-setup\ConfGTS-Server-Setup-0.18.14-x64.exe').Path
          $serverDir = Join-Path $env:ProgramFiles 'ГТС\ConfGTS Server'
          $serverExe = Join-Path $serverDir 'ConfGTSServer.exe'
          $settingsExe = Join-Path $serverDir 'ConfGTS.Server.Settings.exe'
          $ffmpegExe = Join-Path $serverDir 'ffmpeg.exe'

          Remove-Item "$env:ProgramData\ConfGTS" -Recurse -Force -ErrorAction SilentlyContinue
          $p = Start-Process $setup -ArgumentList @('/quiet','/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Server EXE install failed: $($p.ExitCode)" }
          foreach ($path in @($serverExe,$settingsExe,$ffmpegExe)) {
            if (!(Test-Path $path)) { throw "Server EXE expected path missing: $path" }
          }

          $health = Wait-Server 'http://127.0.0.1:8090/health'
          if ($health.version -ne '0.18.14') { throw "Unexpected server version: $($health.version)" }
          [void](Wait-Server ("http://{0}:8090/health" -f $env:COMPUTERNAME))

          $web = Invoke-WebRequest -Uri 'http://127.0.0.1:8090/server-login' -UseBasicParsing -TimeoutSec 5
          if ($web.StatusCode -ne 200 -or $web.Content -notmatch '#0B2F5B') {
            throw "Server web interface failed after EXE install."
          }

          $p = Start-Process $setup -ArgumentList @('/uninstall','/quiet','/norestart') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Server EXE uninstall failed: $($p.ExitCode)" }

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $files = @(
            'artifacts\msi\ConfGTS-0.18.14-x64.msi',
            'artifacts\setup\ConfGTS-Setup-0.18.14-x64.exe',
            'artifacts\server-msi\ConfGTS-Server-0.18.14-x64.msi',
            'artifacts\server-setup\ConfGTS-Server-Setup-0.18.14-x64.exe',
            'artifacts\ConfGTS-Server-0.18.14-Source.zip'
          )
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash $file -Algorithm SHA256
            "$($hash.Hash.ToLower())  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content 'artifacts\SHA256SUMS.txt' -Encoding ascii
          Get-Content 'artifacts\SHA256SUMS.txt'

      - name: Upload tested packages
        uses: actions/upload-artifact@v4
        with:
          name: ConfGTS-0.18.14-tested
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            artifacts/msi/ConfGTS-0.18.14-x64.msi
            artifacts/setup/ConfGTS-Setup-0.18.14-x64.exe
            artifacts/server-msi/ConfGTS-Server-0.18.14-x64.msi
            artifacts/server-setup/ConfGTS-Server-Setup-0.18.14-x64.exe
            artifacts/ConfGTS-Server-0.18.14-Source.zip
            artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.18.14 --cleanup-tag --yes 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host 'No previous v0.18.14 release to delete.' }
          @'
          ConfGTS 0.18.14.

          Окно и системный трей:
          - ConfGTS теперь работает как один экземпляр: повторный запуск ярлыка активирует уже запущенный клиент из трея вместо запуска второго процесса;
          - при скрытии в трей запоминается состояние окна, включая полноэкранное/развернутое состояние;
          - открытие настроек больше не переводит развернутое окно в обычный размер.

          Навигация и контакты:
          - левая панель уменьшена до 210 пикселей;
          - добавлены отдельные квадратные кнопки «Конференции» и «Контакты»;
          - разделы переключаются: в режиме конференций показываются только конференции, в режиме контактов — только контакты;
          - в основной области также появляется отдельный список контактов;
          - ФИО из AD формата «Фамилия Имя Отчество» отображается компактно как «Имя О. Фамилия.».

          Установка:
          - клиентский и серверный MSI получили страницу выбора каталога установки;
          - EXE-установщики показывают Options и передают выбранный InstallFolder в MSI;
          - установка в нестандартный каталог проверяется Windows CI.

          Серверные записи:
          - в ConfGTS Server Settings добавлен выбор каталога хранения записей;
          - существующие записи переносятся в новый каталог;
          - сервер продолжает использовать штатный путь через NTFS junction, поэтому обновления не сбрасывают выбранный каталог.

          Все исправления 0.18.13 и 0.18.12 сохранены.
