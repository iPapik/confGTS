name: Inspect reconstructed ConfGTS server

on:
  push:
    paths:
      - '.github/workflows/inspect-server.yml'
      - 'server-overrides/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct base server
        shell: pwsh
        run: |
          $parts = Get-ChildItem '.\server-source\parts\part*.b64' | Sort-Object Name
          $builder = [System.Text.StringBuilder]::new()
          foreach ($part in $parts) { [void]$builder.Append((Get-Content $part.FullName -Raw).Trim()) }
          $zip = Join-Path $env:RUNNER_TEMP 'server.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($builder.ToString()))
          Expand-Archive $zip -DestinationPath '.' -Force
          .\server-overrides\apply.ps1

      - name: Validate explicit client authentication mode
        shell: pwsh
        run: |
          go test ./server
          if ($LASTEXITCODE -ne 0) { throw 'Server tests failed.' }
          $web = Get-Content '.\server\web.go' -Raw -Encoding UTF8
          if ($web -notmatch 'AuthType string' -or $web -notmatch 'case "local"' -or $web -notmatch 'case "domain"') {
            throw 'Explicit local/domain API authentication patch was not applied.'
          }
          Write-Host 'Local/domain API authentication patch validated.' -ForegroundColor Green

      - name: Validate media-optional conference join
        shell: pwsh
        run: |
          $ui = Get-Content '.\server\ui.go' -Raw -Encoding UTF8
          if ($ui -notmatch 'media API unavailable, continuing without local media') {
            throw 'Server UI does not contain the no-media fallback.'
          }
          if ($ui -match "alert\('Не удалось получить камеру/микрофон") {
            throw 'Server UI still blocks conference entry when media is unavailable.'
          }
          if ($ui -notmatch 'localStream=new MediaStream\(\);return localStream') {
            throw 'Server UI does not create an empty stream fallback.'
          }
          if ($ui -notmatch 'ConfGTS: room not found' -or $ui -notmatch 'await loadRooms\(\)') {
            throw 'Server UI is missing the room-selection startup-race guard.'
          }
          Write-Host 'Conference can join without local media and room selection is race-safe.' -ForegroundColor Green

      - name: Inspect recording implementation
        shell: pwsh
        run: |
          Write-Host '=== RECORDING STORE METHODS ==='
          Select-String -Path '.\server\store.go' -Pattern 'func \(s \*Store\) (Join|Leave|Heartbeat|RoomStatus|StartOrGetRecording|AppendRecording|FinalizeRecording)|Recorder|Recording' -Context 3,28
          Write-Host '=== RECORDING UI FUNCTIONS ==='
          Select-String -Path '.\server\ui.go' -Pattern 'startRecording|stopRecording|MediaRecorder|captureStream|AudioContext|shareScreen|updateStateUI|addVideo|ontrack' -Context 3,18

      - name: Validate automatic recording lifecycle
        shell: pwsh
        run: |
          $ui = Get-Content '.\server\ui.go' -Raw -Encoding UTF8
          $store = Get-Content '.\server\store.go' -Raw -Encoding UTF8
          if ($ui -notmatch 'startRecording\(\)' -or $ui -notmatch 'MediaRecorder' -or $ui -notmatch 'captureStream\(15\)') {
            throw 'Composite conference recording implementation is missing.'
          }
          if ($ui -notmatch 'addAudioStream\(st\)' -or $ui -notmatch 'video-tile video') {
            throw 'Conference-wide audio/video composition is missing.'
          }
          if ($ui -notmatch 'shareScreen\(\)' -or $ui -notmatch 'replaceTrack\(nt\)') {
            throw 'Screen sharing is not part of the conference media path.'
          }
          if ($ui -notmatch 'stopLoops\(false\);await stopRecording\(\);try\{await api') {
            throw 'Recording is not flushed before the recorder leaves.'
          }
          if ($ui -notmatch 'recorder\.start\(2000\)') {
            throw 'Recording chunk interval hardening is missing.'
          }

          if ($ui -notmatch 'recorder\.start\(2000\);drawRecording\(\)') {
            throw 'Recorder canvas starts drawing before MediaRecorder is active.'
          }
          if ($store -notmatch 'if lr\.Recorder == ""' -or $store -notmatch 'lr\.Recorder = key') {
            throw 'First-participant recorder election is missing.'
          }
          if ($store -notmatch 'endIfEmptyLocked' -or $store -notmatch 'len\(lr\.Participants\) != 0') {
            throw 'Last-participant conference shutdown is missing.'
          }
          if ($ui -notmatch 'norm\(roomState\.recorder\)===norm\(ME\.username\)') {
            throw 'Domain username normalization for recorder startup is missing.'
          }
          if ($ui -notmatch 'ConfGTS recording audio mix unavailable') {
            throw 'Recorder no-audio fallback is missing.'
          }
          if ($ui -notmatch 'recordingContext=ctx' -or $ui -notmatch 'recording context missing' -or $ui -notmatch 'attempt<4') {
            throw 'Stable recording context or retry upload hardening is missing.'
          }
          if ($ui -notmatch 'new Blob\(\[\],\{type:mime\}\)' -or $ui -notmatch 'cache:\x27no-store\x27') {
            throw 'Immediate recording handshake or no-cache upload is missing.'
          }
          if ($ui -notmatch 'handleConferenceStopped' -or $ui -notmatch "postMessage\('leave-conference'\)") {
            throw 'Administrative stop is not propagated to conference clients.'
          }
          if ($store -notmatch 'Finalize unfinished recordings for the stopped session' -or $store -notmatch 'Finalize unfinished recordings when the room becomes empty') {
            throw 'Server-side recording finalization guards are missing.'
          }
          $web = Get-Content '.\server\web.go' -Raw -Encoding UTF8
          if ($web -notmatch 'time\.Since\(\*existing\.FinishedAt\) <= 30\*time\.Second') {
            throw 'Final recording upload grace period is missing.'
          }
          if ($web -notmatch 'CanUploadEndedSessionRecording' -or $store -notmatch 'func \(s \*Store\) CanUploadEndedSessionRecording') {
            throw 'Immediate-admin-stop final-chunk authorization is missing.'
          }
          $admin = Get-Content '.\server\admin.go' -Raw -Encoding UTF8
          if ($admin -notmatch 'confgts-live-participants' -or $admin -notmatch 'setInterval\(refreshParticipants,1500\)') {
            throw 'Live server participant refresh is missing.'
          }
          Write-Host 'Automatic recording lifecycle and live participant refresh validated.' -ForegroundColor Green

      - name: Print route and LDAP structure
        shell: pwsh
        run: |
          Write-Host '=== ROUTES / HTTPS ==='
          Get-ChildItem '.\server' -Filter *.go | ForEach-Object {
            Select-String -Path $_.FullName -Pattern 'HandleFunc|Handle\(|ListenAndServe|ServeTLS|tls\.|https|certificate|cert_file|key_file|PublicURL|ListenAddr' -Context 3,8
          }
          Write-Host '=== LDAP / CONTACT SYMBOLS ==='
          Select-String -Path '.\server\ldap.go' -Pattern '^type |^func |Search|DisplayName|mail|userPrincipalName|sAMAccountName|memberOf' -Context 2,12
          Write-Host '=== WEB FULL ==='
          Get-Content '.\server\web.go'
          Write-Host '=== AUTH / LOGIN ==='
          Get-ChildItem '.\server' -Filter *.go | ForEach-Object {
            Select-String -Path $_.FullName -Pattern 'api/login|Login|Authenticate|ValidateLocal|LocalUser|LDAP|Password|vc_session|server-login' -Context 4,16
          }
          Write-Host '=== STORE KNOWN USERS ==='
          Select-String -Path '.\server\store.go' -Pattern 'KnownUsers|KnownUser|Remember|currentUser|Rooms\(' -Context 4,20
          Write-Host '=== TYPES ==='
          Get-Content '.\server\types.go'
