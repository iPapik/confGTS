name: Inspect reconstructed ConfGTS server

on:
  push:
    paths:
      - '.github/workflows/inspect-server.yml'
      - 'server-overrides/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct base server
        shell: pwsh
        run: |
          $parts = Get-ChildItem '.\server-source\parts\part*.b64' | Sort-Object Name
          $builder = [System.Text.StringBuilder]::new()
          foreach ($part in $parts) { [void]$builder.Append((Get-Content $part.FullName -Raw).Trim()) }
          $zip = Join-Path $env:RUNNER_TEMP 'server.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($builder.ToString()))
          Expand-Archive $zip -DestinationPath '.' -Force
          .\server-overrides\apply.ps1

      - name: Validate explicit client authentication mode
        shell: pwsh
        run: |
          go test ./server
          if ($LASTEXITCODE -ne 0) { throw 'Server tests failed.' }
          $web = Get-Content '.\server\web.go' -Raw -Encoding UTF8
          if ($web -notmatch 'AuthType string' -or $web -notmatch 'case "local"' -or $web -notmatch 'case "domain"') {
            throw 'Explicit local/domain API authentication patch was not applied.'
          }
          Write-Host 'Local/domain API authentication patch validated.' -ForegroundColor Green

      - name: Validate media-optional conference join
        shell: pwsh
        run: |
          $ui = Get-Content '.\server\ui.go' -Raw -Encoding UTF8
          if ($ui -notmatch 'media API unavailable, continuing without local media') {
            throw 'Server UI does not contain the no-media fallback.'
          }
          if ($ui -match "alert\('Не удалось получить камеру/микрофон") {
            throw 'Server UI still blocks conference entry when media is unavailable.'
          }
          if ($ui -notmatch 'localStream=new MediaStream\(\);return localStream') {
            throw 'Server UI does not create an empty stream fallback.'
          }
          if ($ui -notmatch 'ConfGTS: room not found' -or $ui -notmatch 'await loadRooms\(\)') {
            throw 'Server UI is missing the room-selection startup-race guard.'
          }
          Write-Host 'Conference can join without local media and room selection is race-safe.' -ForegroundColor Green

      - name: Validate automatic conference recording
        shell: pwsh
        run: |
          $ui = Get-Content '.\server\ui.go' -Raw -Encoding UTF8
          $store = Get-Content '.\server\store.go' -Raw -Encoding UTF8

          foreach ($required in @(
            'MediaRecorder',
            'recorderCanvas.captureStream',
            'addAudioStream',
            'getDisplayMedia',
            '/api/recordings/upload',
            '/api/recordings/finalize'
          )) {
            if ($ui -notmatch [regex]::Escape($required)) {
              throw "Recording pipeline component is missing: $required"
            }
          }

          if ($ui -notmatch 'async function leaveRoom\(\)\{if\(!currentRoom\)return;await stopRecording\(\);') {
            throw 'Conference leave does not flush recording before server leave.'
          }
          if ($ui -notmatch 'async function stopRecording\(\)') {
            throw 'Recording stop/finalize is not awaitable.'
          }
          if ($ui -notmatch 'getDisplayMedia\(\{video:true,audio:true\}\)') {
            throw 'Screen sharing is not requesting optional system/tab audio.'
          }
          if ($store -notmatch 's\.state\.Recordings\[i\]\.SessionID == id' -or
              $store -notmatch 'FinishedAt == nil') {
            throw 'Server does not finalize unfinished recording metadata when the last participant leaves.'
          }
          if ($store -notmatch 'if lr\.Recorder == ""' -or
              $store -notmatch 'lr\.Recorder = key') {
            throw 'Server no longer elects the first participant as recorder.'
          }

          Write-Host 'Automatic first-participant recording and last-participant finalization validated.' -ForegroundColor Green

          $appJsMatch = [regex]::Match($ui, '(?s)const appJS = `(.*?)`\r?\n')
          if (-not $appJsMatch.Success) { throw 'Could not extract ConfGTS appJS for syntax validation.' }
          $appJsPath = Join-Path $env:RUNNER_TEMP 'confgts-app.js'
          Set-Content $appJsPath $appJsMatch.Groups[1].Value -Encoding UTF8
          node --check $appJsPath
          if ($LASTEXITCODE -ne 0) { throw 'ConfGTS appJS contains a JavaScript syntax error.' }

      - name: Print route and LDAP structure
        shell: pwsh
        run: |
          Write-Host '=== ROUTES / HTTPS ==='
          Get-ChildItem '.\server' -Filter *.go | ForEach-Object {
            Select-String -Path $_.FullName -Pattern 'HandleFunc|Handle\(|ListenAndServe|ServeTLS|tls\.|https|certificate|cert_file|key_file|PublicURL|ListenAddr' -Context 3,8
          }
          Write-Host '=== LDAP / CONTACT SYMBOLS ==='
          Select-String -Path '.\server\ldap.go' -Pattern '^type |^func |Search|DisplayName|mail|userPrincipalName|sAMAccountName|memberOf' -Context 2,12
          Write-Host '=== WEB FULL ==='
          Get-Content '.\server\web.go'
          Write-Host '=== AUTH / LOGIN ==='
          Get-ChildItem '.\server' -Filter *.go | ForEach-Object {
            Select-String -Path $_.FullName -Pattern 'api/login|Login|Authenticate|ValidateLocal|LocalUser|LDAP|Password|vc_session|server-login' -Context 4,16
          }
          Write-Host '=== STORE KNOWN USERS ==='
          Select-String -Path '.\server\store.go' -Pattern 'KnownUsers|KnownUser|Remember|currentUser|Rooms\(' -Context 4,20
          Write-Host '=== TYPES ==='
          Get-Content '.\server\types.go'
